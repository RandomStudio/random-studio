<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brussels Studio Trip</title>
<style>
:root{--bg1:#fffbb8;--bg2:#e9d98a;--ink:#7a4f27;--brown:#b2804b;--btn:#fffde0;--bw:min(29vw,29vh);--zoom:1;--w:calc(var(--bw)*var(--zoom));--h:calc(var(--w)*2.2459);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a3320;--bg2:#1c120a;--ink:#f1dfb0;--btn:#3a2917}}
:root[data-theme="dark"]{--bg1:#4a3320;--bg2:#1c120a;--ink:#f1dfb0;--btn:#3a2917}
html,body{height:100%;margin:0}
body{background:#000;color:#f1dfb0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;margin:0;text-align:center;font-size:clamp(13px,2vw,18px);letter-spacing:.18em;text-transform:uppercase;font-weight:700}
h1 small{display:block;font-weight:400;letter-spacing:.1em;opacity:.7;margin-top:4px;font-size:.75em}
.stage{position:absolute;inset:0;perspective:2000px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.rot,.shift{transform-style:preserve-3d;position:relative;width:0;height:0}
.leaf{position:absolute;top:calc(var(--h)/-2);left:0;width:var(--w);height:var(--h);transform-style:preserve-3d;transform-origin:0 50%}
.leaf .leaf{left:100%;top:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
.face.b{transform:rotateY(180deg)}
.edge{position:absolute;top:0;width:4px;height:100%;margin-left:-2px;background:linear-gradient(90deg,#a68c4c,#f3e6ad 50%,#a68c4c);transform:rotateY(90deg);pointer-events:none}
.edge.r{left:100%}
.face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.gloss{position:absolute;inset:0;pointer-events:none;
background:linear-gradient(112deg,transparent calc(var(--sx)*1% - 22%),rgba(255,255,255,.5) calc(var(--sx)*1%),transparent calc(var(--sx)*1% + 22%)),
linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%,rgba(0,0,0,.08) 100%);mix-blend-mode:soft-light}
.gloss::after{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent calc(var(--sx)*1% - 8%),rgba(255,255,255,.28) calc(var(--sx)*1%),transparent calc(var(--sx)*1% + 8%))}
.face.b .gloss{--sx:calc(100 - var(--sxn))}
.face.f .gloss{--sx:var(--sxn)}
.floor{position:absolute;left:50%;top:calc(50% + var(--h)/2 + 4vh);width:calc(var(--w)*3);height:26px;transform:translateX(-50%) scaleX(var(--fs,.4));background:radial-gradient(ellipse,rgba(60,35,10,.4),transparent 70%);filter:blur(6px);pointer-events:none}
.ui{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:600 13px inherit;font-family:inherit;color:#fff;background:#000;border:1.5px solid #fff;border-radius:0;padding:10px 18px;cursor:pointer;box-shadow:none;transition:transform .1s}
button:active{transform:translateY(2px)}
.hint{font-size:12px;opacity:.75;letter-spacing:.04em}
@media (max-width:600px){:root{--bw:min(30vw,26vh)}}
</style></head>
